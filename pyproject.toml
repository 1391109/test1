[project]
name = "claude-code-desktop-docs-mcp"
version = "0.1.0"
description = "MCP server for Claude Code Desktop documentation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
mcp-server = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
